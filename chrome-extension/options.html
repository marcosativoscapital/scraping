<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Solve Scraper — Opções</title>
  <style>
    body { font-family: -apple-system, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; background: #0a0f1c; color: #e6ecf3; }
    h1 { font-size: 22px; margin-bottom: 16px; }
    .row { margin-bottom: 14px; }
    label { display: block; font-size: 13px; color: #98a4b9; margin-bottom: 4px; }
    input { width: 100%; padding: 10px; background: #11192b; border: 1px solid #1a2333; color: #e6ecf3; border-radius: 6px; }
    button { padding: 10px 18px; background: #3b82f6; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; }
    .hint { color: #98a4b9; font-size: 12px; margin-top: 6px; }
    pre { background: #11192b; padding: 12px; border-radius: 6px; font-size: 12px; overflow-x: auto; }
  </style>
</head>
<body>
  <h1>Solve Scraper — Configurações</h1>

  <div class="row">
    <label for="api-url">URL do servidor</label>
    <input type="text" id="api-url" />
    <div class="hint">Padrão: http://127.0.0.1:8765</div>
  </div>

  <div class="row">
    <label for="api-token">Token da API</label>
    <input type="password" id="api-token" />
    <div class="hint">Deve coincidir com <code>API_TOKEN</code> no <code>.env</code> do servidor</div>
  </div>

  <button id="save">Salvar</button>
  <p id="status" class="hint"></p>

  <h2 style="margin-top: 32px;">Como subir o servidor</h2>
  <pre>cd "solve scraper - linked in"
make setup
make server</pre>

  <script src="options.js"></script>
</body>
</html>
